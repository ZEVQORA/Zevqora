<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZEVQORA — offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #f7f8fa;
        color: #0f1115;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 460px; text-align: center; }
      .mark { display: block; margin: 0 auto 22px; }
      h1 { margin: 0 0 10px; font-size: 22px; font-weight: 650; letter-spacing: -0.025em; }
      p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.6; color: #565e6d; }
      .detail {
        margin: 18px 0 22px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #e6e9ee;
        padding: 10px 12px;
        font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
        font-size: 11.5px;
        color: #6a7280;
        word-break: break-all;
      }
      button {
        height: 38px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: #2f6fdc;
        color: #fff;
        font-size: 13.5px;
        font-weight: 550;
        font-family: inherit;
        cursor: pointer;
      }
      button:hover { background: #2a61c4; }
      .note { margin-top: 20px; font-size: 12px; color: #6a7280; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" width="40" height="40" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#0F1115" />
        <path d="M20 21h24l-19 22h19" stroke="#468BFF" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter" fill="none" />
      </svg>
      <h1>ZEVQORA can’t reach the product right now.</h1>
      <p>The app runs the same product you use on the web, so it needs a connection to load. Your local analysis engine is still running and nothing has been lost.</p>
      <div class="detail" id="detail"></div>
      <button id="retry" type="button">Try again</button>
      <p class="note">If this keeps happening, check your network or proxy settings.</p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const target = params.get('target') || '';
      const reason = params.get('reason') || 'unreachable';
      document.getElementById('detail').textContent = `${reason} — ${target}`;
      document.getElementById('retry').addEventListener('click', () => {
        if (target) location.replace(target);
      });
    </script>
  </body>
</html>
