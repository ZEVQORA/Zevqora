name: CI

# Nothing ran the tests before this: the only workflow built the Windows
# installer on a tag, so every check was manual and nothing gated a push.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop-app/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest -q

  desktop:
    name: Desktop (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-app/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-app/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Electron entrypoints parse
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs

  evidence:
    name: Evidence integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff this branch against main below.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The manifests carry CRLF and are immutable, so `sha256sum -c` cannot read
      # them on Linux. The verifier is portable instead.
      - name: Verify published benchmark evidence
        run: python scripts/verify_evidence.py

      - name: Evidence bytes are unmodified on this branch
        run: |
          if ! git diff --quiet origin/main -- docs/evidence/; then
            echo "::error::docs/evidence/ differs from main. Historical evidence is immutable."
            git diff --stat origin/main -- docs/evidence/
            exit 1
          fi
          echo "docs/evidence/ matches main."
