name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web + API (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Release preflight
        run: npm run verify:release

      - name: Production build
        run: npm run build

      - name: API modules load
        run: node --input-type=module -e "await import('./api/[...path].js'); console.log('api ok')"

      - name: Secret scan
        run: |
          # tests/ carries deliberately fake secret shapes to prove redaction works.
          if git grep -nIE "sk-or-[A-Za-z0-9]{10,}|sk-[A-Za-z0-9]{24,}|-----BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}" -- . ':!docs' ':!tests' ':!api/_lib/sanitize.js' ':!desktop-app/backend/artifacts' ; then
            echo "::error::Secret-shaped string committed"; exit 1; fi
          echo "no secret shapes found"

  backend:
    name: Backend (pytest, ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop-app/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest -q

  desktop:
    name: Desktop (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-app/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-app/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Electron entrypoints parse
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs

  evidence:
    name: Evidence integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify published benchmark evidence
        run: python scripts/verify_evidence.py

      - name: Evidence bytes are unmodified on this branch
        run: |
          if ! git diff --quiet origin/main -- docs/evidence/; then
            echo "::error::docs/evidence/ differs from main. Historical evidence is immutable."
            git diff --stat origin/main -- docs/evidence/
            exit 1
          fi
          echo "docs/evidence/ matches main."
